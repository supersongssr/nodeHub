# huntWatchlist.conf — JA3 狩猎名单 (probeHunt.sh 读取)
#
# 这些指纹的共同特征: 【在 vision-curvePreferences(PQ+firefox) 中从未出现,
# 但在被墙过的协议 (vision/reality/xhttp 等) 中反复出现】 → 即"被 PQ 过滤掉的脏客户端".
# 抓到它们时, probeHunt 会关联 xray access.log 得到用户邮箱, 回答"是哪个客户端/哪个用户".
#
# 两个分组 (抓到后解读不同):
#   [WIDESPREAD] ≥5 节点 → 某款客户端软件 (重点: 识别客户端)
#   [NARROW]     <5 节点 → 某个/某几个用户 (重点: 识别用户)
#
# 格式: 每行一个 32 位 hex md5, # 开头为注释. 空行忽略.
# 生成时间: 2026-07-08  (由 ServerStatus-Rust-Moniter scripts/build_hunt_watchlist.py 生成)

